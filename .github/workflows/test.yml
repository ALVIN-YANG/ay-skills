name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify skills
        run: python3 scripts/verify_skills.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify standalone skill copies
        run: python3 scripts/verify_portable_install.py
      - name: Verify release contents
        run: |
          python3 scripts/package_release.py --output "${RUNNER_TEMP}/ay-skills.tar.gz"
          python3 scripts/package_release.py --verify "${RUNNER_TEMP}/ay-skills.tar.gz"

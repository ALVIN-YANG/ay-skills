<svg width="100%" viewBox="0 0 1200 930" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">AY Skills from idea to delivery</title>
  <desc id="description">Six design and delivery skills form an optional product workflow, with seven focused skills for debugging, audio, improvement, writing, review, icons, and App Store releases.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .section { fill: #8B949E; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .skill { fill: #F0F6FC; font-size: 19px; font-weight: 750; }
    .label { fill: #A7B0BA; font-size: 15px; font-weight: 500; }
    .step { font-size: 14px; font-weight: 800; }
  </style>
  <rect x="1" y="1" width="1198" height="928" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <text x="48" y="55" fill="#F0F6FC" font-size="30" font-weight="760">From idea to verified delivery</text>
  <text x="48" y="82" fill="#8B949E" font-size="17">Use one skill alone, or carry approved decisions through the full product workflow.</text>

  <text x="48" y="125" class="section">PRODUCT WORKFLOW</text>
  <g transform="translate(40 145)">
    <rect width="1120" height="270" rx="18" fill="#161B22" stroke="#30363D"/>
    <g transform="translate(20 24)">
      <g><rect width="346" height="100" rx="14" fill="#5DADE2" fill-opacity=".12" stroke="#5DADE2"/><circle cx="30" cy="31" r="16" fill="#5DADE2"/><text x="26" y="36" class="step" fill="#0D1117">1</text><text x="58" y="37" class="skill">$ay-product</text><text x="24" y="72" class="label">Research the problem and define the product</text></g>
      <g transform="translate(367 0)"><rect width="346" height="100" rx="14" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA"/><circle cx="30" cy="31" r="16" fill="#A78BFA"/><text x="26" y="36" class="step" fill="#0D1117">2</text><text x="58" y="37" class="skill">$ay-ui</text><text x="24" y="72" class="label">Approve screens and preserve design.md</text></g>
      <g transform="translate(734 0)"><rect width="346" height="100" rx="14" fill="#F6A94A" fill-opacity=".12" stroke="#F6A94A"/><circle cx="30" cy="31" r="16" fill="#F6A94A"/><text x="26" y="36" class="step" fill="#0D1117">3</text><text x="58" y="37" class="skill">$ay-architecture</text><text x="24" y="72" class="label">Choose system boundaries and ownership</text></g>
      <g transform="translate(0 122)"><rect width="346" height="100" rx="14" fill="#30BFA5" fill-opacity=".12" stroke="#30BFA5"/><circle cx="30" cy="31" r="16" fill="#30BFA5"/><text x="26" y="36" class="step" fill="#0D1117">4</text><text x="58" y="37" class="skill">$ay-api</text><text x="24" y="72" class="label">Define consumer-facing service contracts</text></g>
      <g transform="translate(367 122)"><rect width="346" height="100" rx="14" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8"/><circle cx="30" cy="31" r="16" fill="#38BDF8"/><text x="26" y="36" class="step" fill="#0D1117">5</text><text x="58" y="37" class="skill">$ay-database</text><text x="24" y="72" class="label">Design data for the exact database engine</text></g>
      <g transform="translate(734 122)"><rect width="346" height="100" rx="14" fill="#7C8CF8" fill-opacity=".13" stroke="#7C8CF8"/><circle cx="30" cy="31" r="16" fill="#7C8CF8"/><text x="26" y="36" class="step" fill="#0D1117">6</text><text x="58" y="37" class="skill">$ay-implement</text><text x="24" y="72" class="label">Implement approved decisions and prove them</text></g>
    </g>
  </g>

  <text x="48" y="459" class="section">FOCUSED SKILLS</text>
  <g transform="translate(40 479)">
    <g><rect width="260" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#F26D78"/><text x="24" y="40" class="skill">$ay-fix</text><text x="24" y="69" class="label">Prove cause, then repair</text></g>
    <g transform="translate(280 0)"><rect width="260" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#38BDF8"/><text x="24" y="40" class="skill">$ay-audio</text><text x="24" y="69" class="label">Trace voice bytes to sound</text></g>
    <g transform="translate(560 0)"><rect width="260" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#30BFA5"/><text x="24" y="40" class="skill">$ay-improve</text><text x="24" y="69" class="label">Measure before and after</text></g>
    <g transform="translate(840 0)"><rect width="280" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#A78BFA"/><text x="24" y="40" class="skill">$ay-review</text><text x="24" y="69" class="label">Read-only consistency check</text></g>
    <g transform="translate(0 124)"><rect width="353" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#F6A94A"/><text x="24" y="40" class="skill">$ay-write</text><text x="24" y="69" class="label">Clear, factual, visual writing</text></g>
    <g transform="translate(373 124)"><rect width="353" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#FB7185"/><text x="24" y="40" class="skill">$ay-icon</text><text x="24" y="69" class="label">Store-ready launcher icons</text></g>
    <g transform="translate(746 124)"><rect width="374" height="104" rx="16" fill="#161B22"/><rect width="5" height="104" rx="2.5" fill="#22C55E"/><text x="24" y="40" class="skill">$ay-app-store</text><text x="24" y="69" class="label">Screenshots through live release</text></g>
  </g>

  <g transform="translate(40 755)">
    <rect width="1120" height="126" rx="18" fill="#111820" stroke="#30363D"/>
    <text x="24" y="42" fill="#F0F6FC" font-size="19" font-weight="720">One approval contract across every skill</text>
    <text x="24" y="75" fill="#A7B0BA" font-size="16">A precise request runs directly. Material choices stop once for approval.</text>
    <text x="24" y="101" fill="#A7B0BA" font-size="16">Approved work continues autonomously and reports the highest proof actually reached.</text>
  </g>
</svg>
